name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: '' }
          - { goos: linux,   goarch: arm64, ext: '' }
          - { goos: darwin,  goarch: amd64, ext: '' }
          - { goos: darwin,  goarch: arm64, ext: '' }
          - { goos: windows, goarch: amd64, ext: '.exe' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: true
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          GIT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LD="-s -w \
              -X github.com/redtorchinc/node-agent/internal/buildinfo.Version=${VERSION} \
              -X github.com/redtorchinc/node-agent/internal/buildinfo.GitSHA=${GIT_SHA} \
              -X github.com/redtorchinc/node-agent/internal/buildinfo.BuildTime=${BUILD_TIME}"
          OUT="rt-node-agent_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath -ldflags "$LD" -o "$OUT" ./cmd/rt-node-agent
          echo "ARTIFACT=$OUT" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: checksums
        run: |
          cd artifacts
          sha256sum rt-node-agent_* > SHA256SUMS
      # Whether signing is configured, resolved in its own step.
      #
      # This used to be `if: ${{ env.MINISIGN_KEY != '' }}` on the sign step
      # itself, with MINISIGN_KEY set in that same step's `env:` block. A
      # step's own `env:` is NOT in scope for its own `if:`, so the
      # expression read an undefined value, was always false, and NO RELEASE
      # WAS EVER SIGNED. It skipped silently, which is why it went unnoticed.
      #
      # `secrets` is likewise not available in a step-level `if:`, so testing
      # the secret directly there would not work either. Resolving it to an
      # output sidesteps the context rules entirely, and logs the decision so
      # an unsigned release is visible in the run rather than silent.
      - name: signing status
        id: signing
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          if [ -n "$MINISIGN_KEY" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'release signing: ENABLED'
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'release signing: DISABLED (no MINISIGN_KEY secret configured)'
            echo '::notice title=Unsigned release::No MINISIGN_KEY secret is set, so this release ships without minisign signatures. Artifacts still carry SHA256SUMS and build-provenance attestation. See docs/releasing.md to enable signing.'
          fi

      - name: sign (minisign)
        if: steps.signing.outputs.enabled == 'true'
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSPHRASE: ${{ secrets.MINISIGN_PASSPHRASE }}
        run: |
          # No `|| true` anywhere below: if signing is configured and then
          # fails, the release must fail rather than quietly publish
          # unsigned artifacts. That silent-fallback shape is what hid the
          # original bug.
          sudo apt-get update
          sudo apt-get install -y minisign
          umask 077
          printf '%s\n' "$MINISIGN_KEY" > /tmp/minisign.key
          cd artifacts
          for f in rt-node-agent_* SHA256SUMS; do
            echo "$MINISIGN_PASSPHRASE" | minisign -S -s /tmp/minisign.key -m "$f" -x "$f.minisig"
          done
          shred -u /tmp/minisign.key
          echo "signed $(ls -1 ./*.minisig | wc -l) artifacts"
      - name: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'artifacts/rt-node-agent_*'
      - name: release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/rt-node-agent_*
            artifacts/SHA256SUMS
            artifacts/*.minisig
            scripts/install.sh
            scripts/install.ps1
          generate_release_notes: true
