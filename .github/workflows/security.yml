name: security

# Three scanners that complement CodeQL:
#   * govulncheck — known CVEs in the Go module graph + stdlib
#   * gosec       — Go-specific security linter (weak crypto, unsafe perms, …)
#   * gitleaks    — secret-detection over working tree AND git history
#
# All upload SARIF to the repo's Security tab so triage lives next to
# CodeQL findings.
#
# A fourth job, dependency-review, runs on PRs and blocks merges that
# introduce a vulnerable transitive dep.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily — vuln.go.dev publishes new CVEs continuously, so a weekly
    # cadence would let an issue sit a week before alerting.
    - cron: '23 5 * * *'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: run govulncheck
        # Plain-text output for the run log, exit non-zero on finding.
        # We deliberately do NOT emit SARIF: govulncheck's SARIF output
        # has duplicate strings in rule `properties.tags` which the
        # CodeQL upload validator rejects per the spec
        # (golang/go#67586). The vuln database is small enough that
        # operators can read findings directly from the action log.
        run: govulncheck ./...

  gosec:
    # Matrixed over GOOS because Go build tags mean a single-target scan is a
    # single-platform scan. This job ran ubuntu-only until 2026-08, so every
    # finding in launchd.go, winsvc.go and the *_darwin.go files was
    # invisible to the Security tab — 11 real gosec findings on darwin and 2
    # on windows, none of which had ever been triaged. The platform matrix in
    # CLAUDE.md is the whole point of this repo; the scanner has to see it.
    name: gosec (${{ matrix.goos }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The category is explicit per target, not derived from goos, because
        # linux must keep the historical bare `gosec` category. GitHub only
        # marks a code-scanning alert fixed when a scan under the SAME
        # category stops reporting it — so renaming every category orphans
        # the entire pre-matrix backlog: nothing reports under `gosec` any
        # more, and 41 alerts stay open forever with no job able to close
        # them. Adding categories for new targets is safe; renaming an
        # existing one is not.
        include:
          - goos: linux
            category: gosec
          - goos: darwin
            category: gosec-darwin
          - goos: windows
            category: gosec-windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: true

      # Invoked directly rather than via securego/gosec, which is a Docker
      # action pinned to @master — an unpinnable moving ref in a public repo,
      # and no way to set GOOS for the analysis. `go install` mirrors how the
      # govulncheck job above gets its tool.
      - name: install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: run gosec
        # -no-fail: findings land in the Security tab for triage rather than
        # blocking the build. Suppressions carry a `#nosec <rule> -- reason`
        # comment; anything without a stated reason should be treated as
        # untriaged.
        env:
          GOOS: ${{ matrix.goos }}
        run: gosec -no-fail -fmt sarif -out gosec.sarif ./...

      - name: upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gosec.sarif
          # Distinct category per target, or each upload overwrites the
          # previous one and only the last GOOS survives in the tab. See the
          # matrix comment for why linux's is the bare `gosec`.
          category: ${{ matrix.category }}

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the secret scan catches anything in past
          # commits, not just the working tree.
          fetch-depth: 0

      # Run the gitleaks CLI directly. The action wrapper
      # (gitleaks/gitleaks-action) moved to a paid licence for
      # organisation-owned repos in 2024; the underlying binary is
      # still MIT-licensed and works the same way. Install + invoke
      # it ourselves.
      - name: install gitleaks
        run: |
          version="8.21.2"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: scan working tree
        run: gitleaks detect --source . --no-banner --redact --verbose --report-format sarif --report-path gitleaks.sarif

      - name: upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  dependency-review:
    name: dependency-review (PRs only)
    # Action needs a base ref to diff against; pushes to main don't have one.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          # Block PRs that introduce a moderate-or-higher severity CVE
          # via a new or upgraded transitive dep.
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
